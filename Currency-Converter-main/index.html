<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="crossorigin="anonymous"referrerpolicy="no-referrer"/>

</head>
<body>
    <div class="container">
        <h2>Currency Converter</h2>
        <form action=""id="converter-form">
            <div class="amount">
                <p>Enter Amount</p>
                <input id="amount" value="1" type="number" min="1" step="0.01">
                <div class="dropdown">
                    <div class="from">
                        <p>From</p>
                        <div class="select-container">
                            <img src="https://flagsapi.com/US/flat/64.png"/>
                            <select name="from" id="from-currency">

                            </select>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                    <div class="to">
                        <p>To</p>
                        <div class="select-container">
                            <img src="https://flagsapi.com/IN/flat/64.png" alt="">
                            <select name="to" id="to-currency">

                            </select>
                        </div>
                    </div>
                </div>
                <div class="msg"></div>
                <button type="button" id="convert-btn">Get Exchange Rate</button>
                <button type="button" id="clear-btn">Clear</button>
            </form>
            </div>
            <script src="app.js"></script>
    
</body>
</html>
